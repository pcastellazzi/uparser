# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "https://github.com/google/osv-scanner/"
rev = "b56b5191101d5f27d4787d5583d8d01e9518a7af" # frozen: v2.4.0

[[repos.hooks]]
id = "osv-scanner"
args = ["scan", "source", "--recursive", "."]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "83d9cd684c87d95d656c1458ef04895a7f1cbd8e" # frozen: v8.30.1
hooks = [{id = "gitleaks"}]

[[repos]]
repo = "https://github.com/fsfe/reuse-tool"
rev = "a1bb792acda6fd0724936b4ebbdbc8eceb9c0459" # frozen: v6.2.0
hooks = [{id = "reuse-lint-file"}]

[[repos]]
repo = "https://github.com/DavidAnson/markdownlint-cli2"
rev = "534166213006ec869b773b7ed8c6ebeaad1165d0" # frozen: v0.23.0
hooks = [{id = "markdownlint-cli2"}]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "01a675ea018f2fb714478a5ffb83fcea8374bb06" # frozen: v0.15.21
hooks = [{id = "ruff-check"}, {id = "ruff-format"}]

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "7f8502eb16c9a4b600cfb7fb069ae1154e21fbf9" # frozen: v0.0.60
hooks = [{id = "ty"}]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "b7359babf83a050dcd7bf892538f3df09c3d4ba6" # frozen: 0.11.29
hooks = [{id = "uv-lock"}, {id = "uv-sync"}]
