# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "https://github.com/google/osv-scanner/"
rev = "30bcc134e23fbc35731021ee43ec433c483715d7" # frozen: v2.3.5

[[repos.hooks]]
id = "osv-scanner"
args = ["scan", "source", "--recursive", "."]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "83d9cd684c87d95d656c1458ef04895a7f1cbd8e" # frozen: v8.30.1
hooks = [{id = "gitleaks"}]

[[repos]]
repo = "https://github.com/fsfe/reuse-tool"
rev = "a1bb792acda6fd0724936b4ebbdbc8eceb9c0459" # frozen: v6.2.0
hooks = [{id = "reuse-lint-file"}]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "6a280ba12b7901e47757c868c8c13c6a624c9ecb" # frozen: 0.11.7
hooks = [{id = "uv-lock"}, {id = "uv-sync"}]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "6fec9b7edb08fd9989088709d864a7826dc74e80" # frozen: v0.15.12
hooks = [{id = "ruff-check"}, {id = "ruff-format"}]

[[repos]]
repo = "https://github.com/DavidAnson/markdownlint-cli2"
rev = "996abf60411a8d954288ac9856aae7602b80cbda" # frozen: v0.22.1
hooks = [{id = "markdownlint-cli2"}]
